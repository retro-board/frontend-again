version: 2
updates:
  - package-ecosystem: bun
    directory: /
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    schedule:
      interval: daily
    ignore:
      # Next 16.4 type-checks via the TS JS API, which TypeScript 7 removed
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
